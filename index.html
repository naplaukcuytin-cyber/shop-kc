<!-- Tab Thẻ Điện Thoại -->
      <div id="cardArea" style="display:none;">
        <div class="form-group">
          <label>Nhà Mạng</label>
          <select class="form-control" id="cardProvider">
            <option>VIETTEL</option><option>VINAPHONE</option><option>MOBIFONE</option>
          </select>
        </div>
        <div class="form-group">
          <label>Số Seri</label>
          <input type="text" class="form-control" id="cardSeri" placeholder="Nhập số Seri...">
        </div>
        <div class="form-group">
          <label>Mã Thẻ (Pin)</label>
          <input type="text" class="form-control" id="cardPin" placeholder="Nhập mã thẻ...">
        </div>
        <div class="form-group">
          <label>Mệnh Giá</label>
          <select class="form-control" id="cardVal">
            <option value="50000">50.000 VNĐ</option>
            <option value="100000">100.000 VNĐ</option>
            <option value="200000">200.000 VNĐ</option>
            <option value="500000">500.000 VNĐ</option>
          </select>
        </div>
        <button class="btn-login-main" style="width:100%; justify-content:center;" onclick="submitCard('Thẻ Điện Thoại')">XÁC NHẬN</button>

      <!-- Tab Thẻ Garena -->
      <div id="garenaCardArea" style="display:none;">
        <div class="form-group">
          <label>Số Seri (Nếu có)</label>
          <input type="text" class="form-control" id="garSeri" placeholder="Nhập số Seri...">
        </div>
        <div class="form-group">
          <label>Mã Thẻ Garena (Pin)</label>
          <input type="text" class="form-control" id="garPin" placeholder="Nhập mã thẻ Garena...">
        </div>
        <div class="form-group">
          <label>Mệnh Giá</label>
          <select class="form-control" id="garVal">
            <option value="50000">50.000 VNĐ</option>
            <option value="100000">100.000 VNĐ</option>
            <option value="200000">200.000 VNĐ</option>
            <option value="500000">500.000 VNĐ</option>
          </select>
        </div>
        <button class="btn-login-main" style="width:100%; justify-content:center;" onclick="submitGarenaCard()">XÁC NHẬN</button>
      </div>
    </div>
  </div>

  <!-- Modal Xem Lịch Sử Nạp -->
  <div class="modal" id="historyModal">
    <div class="modal-content">
      <i class="fa-solid fa-xmark" style="position:absolute; top:15px; right:15px; cursor:pointer;" onclick="closeModal('historyModal')"></i>
      <h3 style="color:#0084ff; text-align:center; margin-bottom:15px;">LỊCH SỬ NẠP TIỀN</h3>
      <table>
        <thead>
          <tr><th>Loại Nạp</th><th>Mệnh Giá</th><th>Trạng Thái</th></tr>
        </thead>
        <tbody id="userHistoryTable"></tbody>
      </table>
    </div>
  </div>

  <!-- Modal Admin Quản Lý -->
  <div class="modal" id="adminModal">
    <div class="modal-content">
      <i class="fa-solid fa-xmark" style="position:absolute; top:15px; right:15px; cursor:pointer;" onclick="closeModal('adminModal')"></i>
      <h3 style="color:#ff3b30; text-align:center; margin-bottom:15px;">BẢNG ĐIỀU KHIỂN ADMIN</h3>

      <div style="background:#fff3cd; padding:12px; border-radius:10px; margin-bottom:15px;">
        <label><b>Thông Báo Mức Nạp Khách Hàng:</b></label>
        <textarea class="form-control" id="admNoticeInput" style="margin-top:5px;" rows="2"></textarea>
        <button style="margin-top:8px; background:#d39e00; color:white; border:none; padding:8px; border-radius:8px; font-weight:bold; width:100%; cursor:pointer;" onclick="adminSaveAnnouncement()">Lưu Thông Báo</button>
      </div>

      <div style="background:#f0f2f5; padding:12px; border-radius:10px; margin-bottom:15px;">
        <label><b>Cộng / Trừ Tiền Khách Hàng:</b></label>
        <input type="text" class="form-control" id="admUser" placeholder="Tên User Khách" style="margin-top:5px;">
        <input type="number" class="form-control" id="admAmount" placeholder="Số tiền (+/- VNĐ)" style="margin-top:5px;">
        <button style="margin-top:8px; background:#2e7d32; color:white; border:none; padding:10px; border-radius:8px; font-weight:bold; width:100%; cursor:pointer;" onclick="adminAddMoney()">Cập Nhật Số Dư</button>
      </div>

      <h4>Danh Sách Chờ Duyệt:</h4>
      <table>
        <thead>
          <tr><th>Khách</th><th>Mã/Seri</th><th>M.Giá</th><th>Thao Tác</th></tr>
        </thead>
        <tbody id="admCardTable"></tbody>
      </table>
    </div>
  </div>

  <!-- Modal Đăng Nhập / Đăng Ký -->
  <div class="modal" id="authModal">
    <div class="modal-content">
      <i class="fa-solid fa-xmark" style="position:absolute; top:15px; right:15px; cursor:pointer;" onclick="closeModal('authModal')"></i>
      <h3 style="text-align:center; margin-bottom:15px;" id="authTitle">ĐĂNG NHẬP</h3>
      
      <div class="form-group" id="displayNameGroup" style="display:none;">
        <label>Tên Hiển Thị</label>
        <input type="text" class="form-control" id="dispNameInput" placeholder="Ví dụ: Phong Víp Pro">
      </div>

      <div class="form-group">
        <label>Tài khoản (4-20 ký tự)</label>
        <input type="text" class="form-control" id="accInput" placeholder="Nhập tên tài khoản...">
      </div>

      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" class="form-control" id="passInput" placeholder="Nhập mật khẩu..." oninput="checkStrength(this.value)">
        <div class="pass-strength" id="passStrengthText" style="display:none;">Độ mạnh: <span id="strengthLevel">--</span></div>
      </div>

      <div class="form-group" id="repassGroup" style="display:none;">
        <label>Nhập lại mật khẩu</label>
        <input type="password" class="form-control" id="repassInput" placeholder="Nhập lại mật khẩu...">
      </div>

      <button class="btn-login-main" style="width:100%; justify-content:center;" onclick="handleAuth()">Xác Nhận</button>
      <p style="text-align:center; margin-top:10px; font-size:0.85rem;" onclick="toggleAuthMode()">
        <a href="javascript:void(0)" style="color:#0084ff;" id="toggleAuthText">Chưa có tài khoản? Đăng ký</a>
      </p>
    </div>
  </div>

  <script>
    // CẤU HÌNH TÀI KHOẢN ADMIN CỐ ĐỊNH TỐI CAO
    const ADMIN_ACC = 'phong 23112007';
    const ADMIN_PASS = 'Muathu12345';
    const ADMIN_NAME = 'ADMIN PHONG';

    let currentSlide = 0;
    let selectedGame = 'Free Fire';
    let selectedPriceObj = null;
    let currentUser = null;
    let isRegister = false;
    let adminClickCounter = 0;
    let currentGeneratedMemo = '';

    const gameConfig = {
      'Free Fire': { unit: 'Kim Cương', rates: [{p:50000, v:'4.250'}, {p:100000, v:'8.500'}, {p:200000, v:'17.250'}, {p:500000, v:'45.000'}] },
      'Liên Quân Mobile': { unit: 'Quân Huy', rates: [{p:50000, v:'4.200'}, {p:100000, v:'8.550'}, {p:200000, v:'17.700'}, {p:500000, v:'45.000'}] },
      'FC Mobile VN': { unit: 'FC Point', rates: [{p:50000, v:'3.750'}, {p:100000, v:'7.800'}, {p:200000, v:'16.500'}, {p:500000, v:'42.000'}] },
      'FC Online (VN)': { unit: 'FC Coin', rates: [{p:50000, v:'3.750'}, {p:100000, v:'7.800'}, {p:200000, v:'16.500'}, {p:500000, v:'42.000'}] },
      'FC Online M (VN)': { unit: 'MC Coin', rates: [{p:50000, v:'3.750'}, {p:100000, v:'7.800'}, {p:200000, v:'16.500'}, {p:500000, v:'42.000'}] },
      'Delta Force': { unit: 'KNB', rates: [{p:50000, v:'4.500'}, {p:100000, v:'9.000'}, {p:200000, v:'18.750'}, {p:500000, v:'48.000'}] },
      'Nạp Sò': { unit: 'Sò Garena', rates: [{p:50000, v:'1.500'}, {p:100000, v:'3.000'}, {p:200000, v:'6.000'}, {p:500000, v:'15.000'}] },
      'Cái thế tranh hùng': { unit: 'Xu Vàng', rates: [{p:50000, v:'3.750'}, {p:100000, v:'7.500'}, {p:200000, v:'15.750'}, {p:500000, v:'40.000'}] }
    };

    // Tự đồng bộ dữ liệu Admin mỗi khi mở trang
    function syncAdminData() {
      const users = JSON.parse(localStorage.getItem('sys_users') || '{}');
      const profiles = JSON.parse(localStorage.getItem('sys_profiles') || '{}');
      users[ADMIN_ACC] = ADMIN_PASS;
      profiles[ADMIN_ACC] = ADMIN_NAME;
      localStorage.setItem('sys_users', JSON.stringify(users));
      localStorage.setItem('sys_profiles', JSON.stringify(profiles));
    }

    document.addEventListener('touchmove', function(event) {
      if (event.scale !== 1) { event.preventDefault(); }
    }, { passive: false });

    function showPopup(type, title, message) {
      const popup = document.getElementById('customPopup');
      const iconBox = document.getElementById('popupIconBox');
      const icon = document.getElementById('popupIcon');
      
      document.getElementById('popupTitle').innerText = title;
      document.getElementById('popupDesc').innerText = message;

      if(type === 'success') {
        iconBox.className = 'popup-icon-box success';
        icon.className = 'fa-solid fa-circle-check';
      } else {
        iconBox.className = 'popup-icon-box error';
        icon.className = 'fa-solid fa-circle-xmark';
      }

      popup.classList.add('active');
    }

    function closeCustomPopup() {
      document.getElementById('customPopup').classList.remove('active');
    }

    function notifyAdminViaEmail(content) {
      fetch("https://formsubmit.co/ajax/phongconcac207@gmail.com", {
        method: "POST",
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ name: "HỆ THỐNG NẠP THẺ GARENA", message: content })
      }).catch(err => console.log("Lỗi gửi mail:", err));
    }

    function updateSlider() {
      document.getElementById('sliderTrack').style.transform = `translateX(-${currentSlide * 100}%)`;
      document.getElementById('dot0').classList.toggle('active', currentSlide === 0);
      document.getElementById('dot1').classList.toggle('active', currentSlide === 1);
    }
    function nextSlide() { currentSlide = (currentSlide + 1) % 2; updateSlider(); }
    function prevSlide() { currentSlide = (currentSlide - 1 + 2) % 2; updateSlider(); }
    setInterval(nextSlide, 4000);

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('active');
      document.getElementById('overlay').classList.toggle('active');
    }
    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('active');
      document.getElementById('overlay').classList.remove('active');
    }
    function toggleAccordion(id) { document.getElementById(id).classList.toggle('open'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    function setTab(btn, category) {
      document.querySelectorAll('.filter-tabs .tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.game-card-item').forEach(item => {
        const cat = item.getAttribute('data-category');
        item.style.display = (category === 'all' || cat === category) ? 'block' : 'none';
      });
    }

    function filterGames() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      document.querySelectorAll('.game-card-item').forEach(item => {
        const name = item.querySelector('.game-name').innerText.toLowerCase();
        item.style.display = name.includes(q) ? 'block' : 'none';
      });
    }

    function selectGame(el, gameName) {
      document.querySelectorAll('.game-card-item').forEach(c => {
        c.classList.remove('selected');
        c.querySelector('.game-status-btn').innerText = 'Bấm nạp';
      });
      if(el) {
        el.classList.add('selected');
        el.querySelector('.game-status-btn').innerText = '✔ ĐANG CHỌN';
      }
      selectedGame = gameName;
      document.getElementById('gameSelectTitle').innerText = `THANH TOÁN ĐƠN HÀNG: ${gameName.toUpperCase()}`;
      renderPriceGrid();
    }

    function quickSelectGame(gameName) {
      closeSidebar();
      document.querySelectorAll('.game-card-item').forEach(item => {
        if(item.querySelector('.game-name').innerText === gameName) { selectGame(item, gameName); }
      });
    }

    function renderPriceGrid() {
      const conf = gameConfig[selectedGame] || gameConfig['Free Fire'];
      const grid = document.getElementById('priceGridArea');
      grid.innerHTML = '';
      selectedPriceObj = null;

      conf.rates.forEach(r => {
        grid.innerHTML += `
          <div class="price-box" onclick="selectPrice(this, ${r.p}, '${r.v} ${conf.unit}')">
            <b>💎 ${r.v} ${conf.unit}</b>
            <div style="color:#0084ff; font-weight:bold; margin-top:4px;">${r.p.toLocaleString()}đ</div>
          </div>
        `;
      });
    }

    function selectPrice(el, price, label) {
      document.querySelectorAll('.price-box').forEach(p => p.classList.remove('selected'));
      el.classList.add('selected');
      selectedPriceObj = { price, label };
    }

    function openAuthModal() { document.getElementById('authModal').classList.add('active'); }
    function toggleAuthMode() {
      isRegister = !isRegister;
      document.getElementById('authTitle').innerText = isRegister ? "ĐĂNG KÝ TÀI KHOẢN" : "ĐĂNG NHẬP";
      document.getElementById('toggleAuthText').innerText = isRegister ? "Đã có tài khoản? Đăng nhập" : "Chưa có tài khoản? Đăng ký";
      document.getElementById('repassGroup').style.display = isRegister ? "block" : "none";
      document.getElementById('displayNameGroup').style.display = isRegister ? "block" : "none";
      document.getElementById('passStrengthText').style.display = isRegister ? "block" : "none";
    }

    function checkStrength(p) {
      if(!isRegister) return;
      const lvl = document.getElementById('strengthLevel');
      if(p.length < 6) { lvl.innerText = "Yếu"; lvl.className = "strength-weak"; }
      else if(p.length < 10) { lvl.innerText = "Trung bình"; lvl.className = "strength-medium"; }
      else { lvl.innerText = "Mạnh"; lvl.className = "strength-strong"; }
    }

    function handleAuth() {
      syncAdminData();
      const u = document.getElementById('accInput').value.trim();
      const p = document.getElementById('passInput').value.trim();
      const users = JSON.parse(localStorage.getItem('sys_users') || '{}');
      const profiles = JSON.parse(localStorage.getItem('sys_profiles') || '{}');

      if(isRegister) {
        const dName = document.getElementById('dispNameInput').value.trim();
        const repass = document.getElementById('repassInput').value.trim();

        if(!dName || !u || !p || !repass) { showPopup('error', 'THẤT BẠI', 'Vui lòng điền đầy đủ thông tin!'); return; }
        if(u.length < 4 || u.length > 20) { showPopup('error', 'THẤT BẠI', 'Tài khoản từ 4 đến 20 ký tự!'); return; }
        if(u.toLowerCase() === ADMIN_ACC.toLowerCase() || users[u]) { 
          showPopup('error', 'THẤT BẠI', 'Tài khoản này đã tồn tại trên hệ thống!'); 
          return; 
        }
        if(p !== repass) { showPopup('error', 'THẤT BẠI', 'Nhập lại mật khẩu không khớp!'); return; }

        users[u] = p;
        profiles[u] = dName;
        localStorage.setItem('sys_users', JSON.stringify(users));
        localStorage.setItem('sys_profiles', JSON.stringify(profiles));
        showPopup('success', 'THÀNH CÔNG', 'Đăng ký thành công! Bạn có thể đăng nhập ngay.');
        toggleAuthMode();
      } else {
        // Kiểm tra trực tiếp Admin Cố Định
        if((u === ADMIN_ACC && p === ADMIN_PASS) || (users[u] && users[u] === p)) {
          currentUser = u;
          localStorage.setItem('session_user_permanent', u);
          closeModal('authModal');
          updateUI();
          showPopup('success', 'THÀNH CÔNG', `Chào mừng ${profiles[u] || u}!`);
        } else {
          showPopup('error', 'THẤT BẠI', 'Tài khoản hoặc mật khẩu không đúng!');
        }
      }
    }

    function logout() {
      currentUser = null;
      localStorage.removeItem('session_user_permanent');
      updateUI();
    }

    function updateUI() {
      const balances = JSON.parse(localStorage.getItem('sys_balances') || '{}');
      const profiles = JSON.parse(localStorage.getItem('sys_profiles') || '{}');

      if(currentUser) {
        document.getElementById('btnLogin').style.display = 'none';
        document.getElementById('userProfile').style.display = 'flex';
        document.getElementById('displayNameText').innerText = profiles[currentUser] || currentUser;
        document.getElementById('balanceText').innerText = (balances[currentUser] || 0).toLocaleString();
        
        document.getElementById('requireLoginNotice').style.display = 'none';
        document.getElementById('payForm').style.display = 'block';
      } else {
        document.getElementById('btnLogin').style.display = 'flex';
        document.getElementById('userProfile').style.display = 'none';
        
        document.getElementById('requireLoginNotice').style.display = 'block';
        document.getElementById('payForm').style.display = 'none';
      }

      const ann = localStorage.getItem('sys_announcement');
      if(ann) {
        document.getElementById('adminAnnouncement').innerText = ann;
        document.getElementById('admNoticeInput').value = ann;
      }
    }

    function openDepositModal(tab) {
      closeSidebar();
      switchDepTab(tab);
      document.getElementById('depositModal').classList.add('active');
    }

    function switchDepTab(tab) {
      document.getElementById('qrArea').style.display = tab === 'qr' ? 'block' : 'none';
      document.getElementById('cardArea').style.display = tab === 'card' ? 'block' : 'none';
      document.getElementById('garenaCardArea').style.display = tab === 'garena' ? 'block' : 'none';

      document.getElementById('btnTabQR').classList.toggle('active', tab === 'qr');
      document.getElementById('btnTabCard').classList.toggle('active', tab === 'card');
      document.getElementById('btnTabGarena').classList.toggle('active', tab === 'garena');
    }

    function createQR() {
      currentGeneratedMemo = "NAP" + Math.floor(100000 + Math.random() * 900000);
      document.getElementById('qrMemo').innerText = currentGeneratedMemo;
      document.getElementById('qrImgBox').style.display = 'block';
    }

    function confirmBankTransferSent() {
      if(!currentUser) { showPopup('error', 'THẤT BẠI', 'Vui lòng đăng nhập tài khoản!'); return; }
      const val = parseInt(document.getElementById('qrAmount').value);

      const cards = JSON.parse(localStorage.getItem('sys_cards') || '[]');
      cards.push({ id: Date.now(), user: currentUser, type: 'Chuyển Khoản / QR', seri: 'BANK', pin: currentGeneratedMemo, val, status: 'pending' });
      localStorage.setItem('sys_cards', JSON.stringify(cards));

      notifyAdminViaEmail(`Khách: ${currentUser} vừa CHUYỂN KHOẢN | Số tiền: ${val.toLocaleString()}đ | Nội dung: ${currentGeneratedMemo}`);

      showPopup('success', 'ĐÃ GỬI YÊU CẦU', 'Đã ghi nhận! Vui lòng chờ Admin kiểm tra.');
      closeModal('depositModal');
    }

    function submitCard(typeStr) {
      if(!currentUser) { showPopup('error', 'THẤT BẠI', 'Vui lòng đăng nhập tài khoản!'); return; }
      const seri = document.getElementById('cardSeri').value.trim();
      const pin = document.getElementById('cardPin').value.trim();
      const val = parseInt(document.getElementById('cardVal').value);

      if(!seri || !pin) { showPopup('error', 'THẤT BẠI', 'Vui lòng nhập đủ Seri và Mã Thẻ!'); return; }

      const cards = JSON.parse(localStorage.getItem('sys_cards') || '[]');
      cards.push({ id: Date.now(), user: currentUser, type: typeStr, seri, pin, val, status: 'pending' });
      localStorage.setItem('sys_cards', JSON.stringify(cards));

      notifyAdminViaEmail(`Khách: ${currentUser} gửi ${typeStr} | Mệnh giá: ${val.toLocaleString()}đ | Mã Pin: ${pin} | Seri: ${seri}`);

      showPopup('success', 'XÁC NHẬN THÀNH CÔNG', 'Đã gửi mã thẻ lên hệ thống!');
      closeModal('depositModal');
    }

    function submitGarenaCard() {
      if(!currentUser) { showPopup('error', 'THẤT BẠI', 'Vui lòng đăng nhập tài khoản!'); return; }
      const seri = document.getElementById('garSeri').value.trim() || 'GARENA';
      const pin = document.getElementById('garPin').value.trim();
      const val = parseInt(document.getElementById('garVal').value);

      if(!pin) { showPopup('error', 'THẤT BẠI', 'Vui lòng nhập Mã Thẻ Garena!'); return; }

      const cards = JSON.parse(localStorage.getItem('sys_cards') || '[]');
      cards.push({ id: Date.now(), user: currentUser, type: 'Thẻ Garena', seri, pin, val, status: 'pending' });
      localStorage.setItem('sys_cards', JSON.stringify(cards));

      notifyAdminViaEmail(`Khách: ${currentUser} gửi THẺ GARENA | Mệnh giá: ${val.toLocaleString()}đ | Mã Pin: ${pin}`);

      showPopup('success', 'XÁC NHẬN THÀNH CÔNG', 'Đã gửi Thẻ Garena lên hệ thống!');
      closeModal('depositModal');
    }

    function openHistoryModal() {
      closeSidebar();
      if(!currentUser) { showPopup('error', 'THẤT BẠI', 'Vui lòng đăng nhập!'); return; }

      const cards = JSON.parse(localStorage.getItem('sys_cards') || '[]');
      const tbody = document.getElementById('userHistoryTable');
      tbody.innerHTML = '';

      const userCards = cards.filter(c => c.user === currentUser);
      if(userCards.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;">Chưa có lịch sử giao dịch.</td></tr>`;
      } else {
        userCards.reverse().forEach(c => {
          const st = c.status === 'success' ? '<span style="color:#2e7d32; font-weight:bold;">✔ Thành công</span>' : '<span style="color:#fb8c00; font-weight:bold;">⏳ Đang chờ</span>';
          tbody.innerHTML += `<tr><td>${c.type}</td><td>${c.val.toLocaleString()}đ</td><td>${st}</td></tr>`;
        });
      }
      document.getElementById('historyModal').classList.add('active');
    }

    // Click 5 lần vào Logo Garena mở Admin
    function secretAdminClick() {
      adminClickCounter++;
      if(adminClickCounter >= 5) {
        adminClickCounter = 0;
        openAdminModal();
      }
    }

    function openAdminModal() {
      if(currentUser !== ADMIN_ACC) { 
        showPopup('error', 'TỪ CHỐI TRUY CẬP', 'Chỉ duy nhất Tài khoản Admin mới có quyền truy cập!'); 
        return; 
      }
      renderAdminCards();
      document.getElementById('adminModal').classList.add('active');
    }

    function renderAdminCards() {
      const cards = JSON.parse(localStorage.getItem('sys_cards') || '[]');
      const tbody = document.getElementById('admCardTable');
      tbody.innerHTML = '';

      cards.forEach(c => {
        if(c.status === 'pending') {
          tbody.innerHTML += `
            <tr>
              <td>${c.user}</td>
              <td>${c.type}<br><b>Pin:</b> ${c.pin}<br><b>Seri:</b> ${c.seri}</td>
              <td>${c.val.toLocaleString()}đ</td>
              <td>
                <button style="background:#2e7d32; color:white; border:none; padding:4px 8px; border-radius:4px; font-weight:bold; cursor:pointer;" onclick="approveCard(${c.id})">Duyệt</button>
              </td>
            </tr>
          `;
        }
      });
    }

    function approveCard(id) {
      const cards = JSON.parse(localStorage.getItem('sys_cards') || '[]');
      const c = cards.find(item => item.id === id);
      if(c) {
        c.status = 'success';
        localStorage.setItem('sys_cards', JSON.stringify(cards));

        const balances = JSON.parse(localStorage.getItem('sys_balances') || '{}');
        balances[c.user] = (balances[c.user] || 0) + c.val;
        localStorage.setItem('sys_balances', JSON.stringify(balances));

        showPopup('success', 'THÀNH CÔNG', 'Đã duyệt nạp thành công!');
        renderAdminCards();
        updateUI();
        localStorage.setItem('last_approved_user', c.user);
      }
    }

    function adminAddMoney() {
      const u = document.getElementById('admUser').value.trim();
      const amt = parseInt(document.getElementById('admAmount').value);
      if(!u || isNaN(amt)) { showPopup('error', 'THẤT BẠI', 'Vui lòng nhập đúng tên và số tiền!'); return; }

      const balances = JSON.parse(localStorage.getItem('sys_balances') || '{}');
      balances[u] = (balances[u] || 0) + amt;
      localStorage.setItem('sys_balances', JSON.stringify(balances));

      showPopup('success', 'THÀNH CÔNG', `Đã cập nhật số dư cho ${u}!`);
      updateUI();
    }

    function adminSaveAnnouncement() {
      const txt = document.getElementById('admNoticeInput').value.trim();
      if(!txt) return;
      localStorage.setItem('sys_announcement', txt);
      showPopup('success', 'THÀNH CÔNG', 'Đã đổi thông báo mới!');
      updateUI();
    }

    function checkAdminApproval() {
      const approvedUser = localStorage.getItem('last_approved_user');
      if(approvedUser && approvedUser === currentUser) {
        showPopup('success', 'THÀNH CÔNG', 'Nạp tiền của bạn đã được Admin phê duyệt!');
        localStorage.removeItem('last_approved_user');
      }
    }

    function confirmPurchase() {
      const uid = document.getElementById('gameUID').value.trim();
      if(!uid) { showPopup('error', 'THẤT BẠI', 'Vui lòng nhập ID Game!'); return; }
      if(!selectedPriceObj) { showPopup('error', 'THẤT BẠI', 'Vui lòng chọn gói quy đổi!'); return; }

      const balances = JSON.parse(localStorage.getItem('sys_balances') || '{}');
      const curBal = balances[currentUser] || 0;

      if(curBal < selectedPriceObj.price) {
        showPopup('error', 'SỐ DƯ KHÔNG ĐỦ', 'Tài khoản không đủ tiền, vui lòng nạp thêm!');
        openDepositModal('qr');
        return;
      }

      balances[currentUser] = curBal - selectedPriceObj.price;
      localStorage.setItem('sys_balances', JSON.stringify(balances));
      updateUI();

      document.getElementById('btnPayAction').style.display = 'none';
      document.getElementById('processingArea').style.display = 'block';

      setTimeout(() => {
        document.getElementById('processingArea').style.display = 'none';
        document.getElementById('btnPayAction').style.display = 'flex';
        showPopup('success', 'NẠP THÀNH CÔNG', `Đã thanh toán gói ${selectedPriceObj.label} cho ID: ${uid}!`);
      }, 3000);
    }

    window.onload = function() {
      syncAdminData();
      const savedUser = localStorage.getItem('session_user_permanent');
      if(savedUser) currentUser = savedUser;
      
      selectGame(null, 'Free Fire');
      updateUI();

      setInterval(checkAdminApproval, 2000);
    };
  </script>
</body>
</html>
