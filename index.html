<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mạng Xã Hội Mini - Đăng Nhập</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            width: 300px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h2 { text-align: center; color: #38bdf8; }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #0ea5e9; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Đăng Nhập</h2>
        <form>
            <label>Tên tài khoản</label>
            <input type="text" placeholder="Nhập username..." required>
            
            <label>Mật khẩu</label>
            <input type="password" placeholder="Nhập mật khẩu..." required>
            
            <button type="submit">Vào Mạng Xã Hội</button>
        </form>
    </div>

</body>
</html>
