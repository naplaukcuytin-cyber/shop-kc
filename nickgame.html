<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Nick Game • Shop KC</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:Lexend,Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:16px}.top{background:#fff;border-bottom:1px solid #e6eaf0;position:sticky;top:0;z-index:20}.bar{max-width:1200px;margin:auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:800;color:#1683ff;text-decoration:none;font-size:20px}.actions{display:flex;gap:8px;align-items:center}.btn{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer}.primary{background:#1683ff;color:white}.gray{background:#eef1f5;color:#445}.hero{background:linear-gradient(135deg,#1683ff,#6b5cff);color:white;border-radius:20px;padding:28px;margin:18px 0}.hero h1{margin:0 0 8px}.hero p{margin:0;opacity:.9}.tools{display:flex;gap:10px;margin-bottom:16px}.tools input,.tools select{flex:1;border:1px solid #e0e5ed;border-radius:12px;padding:12px;font:inherit;background:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid #e6eaf0;border-radius:16px;overflow:hidden;box-shadow:0 5px 20px rgba(20,30,50,.05)}.pic{width:100%;height:180px;object-fit:cover;background:#eef1f5}.body{padding:14px}.name{font-weight:800;min-height:42px}.meta{color:#697386;font-size:12px;margin:7px 0}.price{font-weight:800;color:#e53935;font-size:18px;margin:8px 0}.empty{text-align:center;padding:40px;color:#697386}.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}.modal.show{display:flex}.dialog{background:#fff;border-radius:18px;width:min(480px,100%);padding:20px}.dialog h2{margin-top:0}.dialog input,.dialog textarea{width:100%;padding:11px;border:1px solid #dfe4ec;border-radius:10px;margin:6px 0 12px;font:inherit}.close{float:right;border:0;background:#eee;border-radius:50%;width:34px;height:34px;cursor:pointer}.note{font-size:12px;color:#697386}.status{margin-top:10px;font-size:13px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.grid{grid-template-columns:1fr 1fr;gap:9px}.pic{height:130px}.body{padding:10px}.name{font-size:13px}.price{font-size:15px}.hero{padding:20px}.tools{flex-direction:column}.actions .btn{padding:8px 10px;font-size:12px}}
</style></head><body>
<header class="top"><div class="bar"><a class="brand" href="index.html">SHOP KC</a><div class="actions"><button class="btn gray" onclick="goHome()"><i class="fa fa-home"></i> Trang chủ</button><button class="btn primary" id="accountBtn" onclick="accountAction()"><i class="fa fa-user"></i> Đăng nhập</button></div></div></header>
<main class="wrap"><section class="hero"><h1>🎮 NICK GAME</h1><p>Kho tài khoản game cập nhật realtime từ Shop KC.</p></section><div class="tools"><input id="search" placeholder="Tìm nick, game, tên tài khoản..." oninput="render()"><select id="gameFilter" onchange="render()"><option value="">Tất cả game</option></select></div><section id="grid" class="grid"></section></main>
<div id="buyModal" class="modal"><div class="dialog"><button class="close" onclick="closeModal()">×</button><h2>Mua Nick Game</h2><div id="buyInfo"></div><label>Ghi chú</label><textarea id="note" rows="3" placeholder="Thông tin thêm (nếu có)"></textarea><button class="btn primary" style="width:100%" onclick="submitOrder()">Xác nhận mua</button><div id="buyStatus" class="status"></div></div></div>
<script>
const firebaseConfig={
 apiKey:'AIzaSyCt2ExrDINqixjs3bfEewOviB4ICTfrSEs',
 authDomain:'shop-kc.firebaseapp.com',
 projectId:'shop-kc',
 storageBucket:'shop-kc.firebasestorage.app',
 messagingSenderId:'1073242689799',
 appId:'1:1073242689799:web:41d0dc7795eb74a93df5a2',
 measurementId:'G-Q9VN7NZHR0',
 databaseURL:'https://shop-kc-default-rtdb.firebaseio.com'
};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.database();let products={},selected=null,currentUser=null,currentUsername='';
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function goHome(){location.href='index.html'}
function accountAction(){if(currentUser) alert('Tài khoản: '+currentUsername);else location.href='index.html#login'}
function load(){
  db.ref('products').on('value',s=>{
    var root=s.val()||{};
    if(Object.keys(root).length){ products=root; buildFilters(); render(); return; }
    db.ref('siteConfig/nickProducts').on('value',s2=>{products=s2.val()||{};buildFilters();render()},e=>{document.getElementById('grid').innerHTML='<div class="empty">Không tải được danh sách nick. '+esc(e.message)+'</div>'});
  },e=>{document.getElementById('grid').innerHTML='<div class="empty">Không tải được danh sách nick. '+esc(e.message)+'</div>'});
}
function buildFilters(){const sel=document.getElementById('gameFilter'),old=sel.value, games=[...new Set(Object.values(products).map(p=>String(p.game||p.category||'').trim()).filter(Boolean))];sel.innerHTML='<option value="">Tất cả game</option>'+games.map(g=>'<option>'+esc(g)+'</option>').join('');sel.value=games.includes(old)?old:''}
function render(){const q=document.getElementById('search').value.toLowerCase().trim(),g=document.getElementById('gameFilter').value;const arr=Object.entries(products).map(([id,p])=>({id,...p})).filter(p=>p.status!=='sold'&&p.sold!==true).filter(p=>(!g||String(p.game||p.category||'')===g)&&(!q||JSON.stringify(p).toLowerCase().includes(q)));const grid=document.getElementById('grid');if(!arr.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1">Chưa có nick phù hợp.</div>';return}grid.innerHTML=arr.map(p=>`<article class="card"><img class="pic" src="${esc(p.image||p.img||'')}" onerror="this.style.display='none'"><div class="body"><div class="name">${esc(p.name||p.title||p.game||'Nick Game')}</div><div class="meta">🎮 ${esc(p.game||p.category||'Game')} ${p.uid?' • UID '+esc(p.uid):''}</div><div class="price">${Number(p.price||0).toLocaleString('vi-VN')}đ</div><button class="btn primary" style="width:100%" onclick="openBuy('${esc(p.id||'')}')">Mua ngay</button></div></article>`).join('')}
function openBuy(id){selected=products[id];if(!selected){selected=Object.values(products).find(p=>p.id===id)}if(!selected)return;if(!currentUser){location.href='index.html#login';return}document.getElementById('buyInfo').innerHTML='<b>'+esc(selected.name||selected.title||selected.game||'Nick Game')+'</b><p>'+Number(selected.price||0).toLocaleString('vi-VN')+'đ</p>';document.getElementById('buyStatus').textContent='';document.getElementById('note').value='';document.getElementById('buyModal').classList.add('show')}
function closeModal(){document.getElementById('buyModal').classList.remove('show')}
function submitOrder(){
  if(!currentUser||!selected)return;
  const price=Number(selected.price||0);
  if(price<=0)return;
  const status=document.getElementById('buyStatus');
  status.textContent='Đang kiểm tra số dư...';
  const balRef=db.ref('balances/'+encodeURIComponent(currentUsername));
  balRef.once('value').then(function(s){
    const raw=s.val(); const balance=Number(raw&&typeof raw==='object'?(raw.balance??raw.amount??raw.money??raw.wallet??raw.value??0):raw)||0;
    if(balance<price) throw new Error('Số dư không đủ.');
    const id=db.ref('nickOrders').push().key;
    const order={productId:selected.id||null,product:selected.name||selected.title||selected.game||'Nick Game',game:selected.game||selected.category||'',price,user:currentUsername,uid:selected.uid||'',note:document.getElementById('note').value.trim(),status:'pending',timestamp:firebase.database.ServerValue.TIMESTAMP};
    return db.ref('nickOrders/'+id).set(order);
  }).then(()=>{status.textContent='Đã gửi đơn. Admin sẽ xử lý đơn của bạn.';setTimeout(closeModal,1200)}).catch(e=>status.textContent='Lỗi: '+e.message);
}
auth.onAuthStateChanged(u=>{currentUser=u||null;if(u){db.ref('customerRegistry').orderByChild('uid').equalTo(u.uid).once('value').then(s=>{const v=s.val()||{};const k=Object.keys(v)[0];currentUsername=k||u.email.split('@')[0];document.getElementById('accountBtn').innerHTML='<i class="fa fa-user"></i> '+esc(currentUsername)}).catch(()=>{currentUsername=u.email.split('@')[0];document.getElementById('accountBtn').innerHTML='<i class="fa fa-user"></i> '+esc(currentUsername)})}else{currentUsername='';document.getElementById('accountBtn').innerHTML='<i class="fa fa-user"></i> Đăng nhập'}});load();
</script>
<script id="shopKCNickAuthSync">
(function(){
  function boot(){
    if(!window.firebase) return;
    const firebaseConfig={
 apiKey:'AIzaSyCt2ExrDINqixjs3bfEewOviB4ICTfrSEs',
 authDomain:'shop-kc.firebaseapp.com',
 projectId:'shop-kc',
 storageBucket:'shop-kc.firebasestorage.app',
 messagingSenderId:'1073242689799',
 appId:'1:1073242689799:web:41d0dc7795eb74a93df5a2',
 measurementId:'G-Q9VN7NZHR0',
 databaseURL:'https://shop-kc-default-rtdb.firebaseio.com'
};
    if(!firebase.apps || !firebase.apps.length) firebase.initializeApp(firebaseConfig);
    var a=firebase.auth();
    a.onAuthStateChanged(function(user){
      window.shopKCCurrentUser=user||null;
      document.querySelectorAll('[data-shopkc-account]').forEach(function(el){
        el.textContent=user ? ('Tài khoản: '+(user.email||'Đã đăng nhập')) : 'Đăng nhập';
      });
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>
</body></html>
