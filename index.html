<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Chat Mini - Telegram Style</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0e1621;
            color: #f5f5f5;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar danh sách chat (Bên trái) */
        .sidebar {
            width: 320px;
            background-color: #17212b;
            border-right: 1px solid #0e1621;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 15px;
            background-color: #17212b;
            border-bottom: 1px solid #0e1621;
        }
        .search-box {
            width: 100%;
            padding: 8px 12px;
            background-color: #242f3d;
            border: none;
            border-radius: 20px;
            color: #fff;
            outline: none;
        }
        .chat-list {
            flex: 1;
            overflow-y: auto;
        }
        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        .chat-item:hover, .chat-item.active {
            background-color: #2b5278;
        }
        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: #5288c1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 12px;
            color: #fff;
            flex-shrink: 0;
        }
        .chat-info {
            flex: 1;
            overflow: hidden;
        }
        .chat-name {
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 4px;
        }
        .chat-last-message {
            font-size: 13px;
            color: #899bb1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Khung chat chính (Bên phải) */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #0e1621;
            background-image: radial-gradient(#1e2c3a 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .chat-header {
            padding: 12px 20px;
            background-color: #17212b;
            border-bottom: 1px solid #0e1621;
            font-weight: bold;
            font-size: 16px;
        }
        .messages-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 65%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
        }
        .message.incoming {
            background-color: #182533;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .message.outgoing {
            background-color: #2b5278;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        /* Ô nhập tin nhắn */
        .chat-input-area {
            padding: 12px 20px;
            background-color: #17212b;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .chat-input {
            flex: 1;
            padding: 10px 15px;
            background-color: #242f3d;
            border: none;
            border-radius: 20px;
            color: #fff;
            outline: none;
            font-size: 14px;
        }
        .send-btn {
            background-color: #5288c1;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .send-btn:hover { background-color: #4074a8; }
    </style>
</head>
<body>

    <!-- Sidebar chứa danh sách đoạn chat -->
    <div class="sidebar">
        <div class="sidebar-header">
            <input type="text" class="search-box" placeholder="Tìm kiếm...">
        </div>
        <div class="chat-list">
            <div class="chat-item active">
                <div class="avatar" style="background-color: #e17076;">T</div>
                <div class="chat-info">
                    <div class="chat-name">Nhóm Lập Trình Web</div>
                    <div class="chat-last-message">Chào mọi người, app này giống Telegram phết!</div>
                </div>
            </div>
            <div class="chat-item">
                <div class="avatar" style="background-color: #a29bfe;">A</div>
                <div class="chat-info">
                    <div class="chat-name">Anh Developer</div>
                    <div class="chat-last-message">Đã gửi một đoạn mã nguồn...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Khung chat chính -->
    <div class="chat-area">
        <div class="chat-header">Nhóm Lập Trình Web</div>
        
        <div class="messages-box" id="messagesBox">
            <div class="message incoming">Chào bạn, đây là giao diện mô phỏng Telegram!</div>
            <div class="message outgoing">Quá mượt luôn, màu sắc y chang bản gốc.</div>
        </div>

        <div class="chat-input-area">
            <input type="text" class="chat-input" id="messageInput" placeholder="Nhắn tin...">
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            let input = document.getElementById("messageInput");
            let text = input.value.trim();
            if (text === "") return;

            let box = document.getElementById("messagesBox");
            
            // Tạo thẻ div chứa tin nhắn gửi đi
            let msgDiv = document.createElement("div");
            msgDiv.className = "message outgoing";
            msgDiv.innerText = text;
            
            box.appendChild(msgDiv);
            input.value = "";
            
            // Tự động cuộn xuống tin nhắn mới nhất
            box.scrollTop = box.scrollHeight;
        }
    </script>

</body>
</html>
