<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>SHOP RANDOM ACC FREE FIRE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    color:#172033;
}

header{
    position:sticky;
    top:0;
    z-index:50;
    background:#fff;
    border-bottom:1px solid #e8eaf0;
}

.nav{
    max-width:1200px;
    margin:auto;
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
}

.logo{
    font-size:21px;
    font-weight:900;
}

.logo span{
    color:#ff3b30;
}

.nav-right{
    display:flex;
    align-items:center;
    gap:10px;
}

button{
    border:0;
    cursor:pointer;
    font-weight:700;
}

.btn{
    padding:11px 16px;
    border-radius:10px;
    background:#111827;
    color:#fff;
}

.btn-red{
    background:#ff3b30;
}

.balance{
    background:#fff3f1;
    color:#ff3b30;
    padding:10px 14px;
    border-radius:10px;
    font-weight:800;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px 16px 60px;
}

.hero{
    min-height:310px;
    border-radius:24px;
    padding:40px;
    display:flex;
    align-items:center;
    background:
        linear-gradient(
            135deg,
            #171923,
            #303344
        );
    color:white;
    overflow:hidden;
    position:relative;
}

.hero:after{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    border-radius:50%;
    background:#ff3b30;
    opacity:.18;
    right:-70px;
    top:-80px;
}

.hero-content{
    position:relative;
    z-index:2;
    max-width:650px;
}

.hero h1{
    font-size:46px;
    margin-bottom:15px;
}

.hero p{
    color:#d7d9df;
    line-height:1.6;
}

.hero-buttons{
    margin-top:25px;
    display:flex;
    gap:10px;
}

.section{
    margin-top:30px;
}

.section-title{
    font-size:25px;
    font-weight:900;
    margin-bottom:16px;
}

.packages{
    display:grid;
    grid-template-columns:
        repeat(4,1fr);
    gap:16px;
}

.card{
    background:white;
    border-radius:18px;
    overflow:hidden;
    border:1px solid #e8eaf0;
    transition:.2s;
}

.card:hover{
    transform:translateY(-4px);
    box-shadow:
        0 15px 35px
        rgba(0,0,0,.08);
}

.card-image{
    height:145px;
    background:
        linear-gradient(
            135deg,
            #ff3b30,
            #ff8a00
        );
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:38px;
    font-weight:900;
}

.card-body{
    padding:17px;
}

.badge{
    display:inline-block;
    background:#fff0ed;
    color:#ff3b30;
    padding:5px 8px;
    border-radius:7px;
    font-size:11px;
    font-weight:900;
}

.card h3{
    margin:10px 0;
}

.stock{
    color:#707786;
    font-size:13px;
    margin-bottom:13px;
}

.price{
    font-size:22px;
    font-weight:900;
    color:#ff3b30;
    margin-bottom:12px;
}

.buy{
    width:100%;
    padding:12px;
    border-radius:10px;
    background:#ff3b30;
    color:#fff;
}

.empty{
    grid-column:1/-1;
    background:#fff;
    border-radius:15px;
    padding:30px;
    text-align:center;
    color:#777;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal{
    width:100%;
    max-width:450px;
    background:#fff;
    border-radius:20px;
    padding:25px;
    max-height:90vh;
    overflow:auto;
}

.modal h2{
    margin-bottom:18px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:10px;
    margin:7px 0 12px;
    outline:none;
}

.modal-btn{
    width:100%;
    padding:13px;
    background:#ff3b30;
    color:#fff;
    border-radius:10px;
    margin-top:5px;
}

.close{
    float:right;
    background:#eee;
    width:32px;
    height:32px;
    border-radius:50%;
}

.user-panel{
    background:#fff;
    padding:20px;
    border-radius:18px;
    border:1px solid #eee;
}

.hidden{
    display:none!important;
}

.notice{
    padding:13px;
    border-radius:10px;
    background:#f4f5f7;
    margin:10px 0;
    line-height:1.5;
}

.order{
    padding:14px;
    border:1px solid #eee;
    border-radius:12px;
    margin-top:10px;
}

.account-result{
    background:#111827;
    color:white;
    border-radius:14px;
    padding:18px;
    margin-top:15px;
}

.account-row{
    padding:10px 0;
    border-bottom:1px solid #333;
}

@media(max-width:900px){

    .packages{
        grid-template-columns:
            repeat(2,1fr);
    }

}

@media(max-width:600px){

    .hero{
        padding:28px 20px;
        min-height:270px;
    }

    .hero h1{
        font-size:32px;
    }

    .packages{
        grid-template-columns:1fr;
    }

    .balance{
        font-size:12px;
    }

    .nav{
        height:62px;
    }

}

</style>

</head>

<body>

<header>

<div class="nav">

<div class="logo">
RANDOM <span>ACC FF</span>
</div>

<div class="nav-right">

<div
    id="balance"
    class="balance"
>
0đ
</div>

<button
    id="loginButton"
    class="btn"
    onclick="openAuth()"
>
Đăng nhập
</button>

<button
    id="logoutButton"
    class="btn hidden"
    onclick="logout()"
>
Thoát
</button>

</div>

</div>

</header>


<main class="container">

<section class="hero">

<div class="hero-content">

<h1>
BÓC ACC RANDOM
</h1>

<p>
Kho Random Acc Free Fire.
Nạp tiền vào ví và sử dụng số dư
để mua acc tự động.
</p>

<div class="hero-buttons">

<button
    class="btn btn-red"
    onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})"
>
XEM KHO ACC
</button>

<button
    class="btn"
    onclick="openDeposit()"
>
NẠP TIỀN
</button>

</div>

</div>

</section>


<section
    id="products"
    class="section"
>

<div class="section-title">
🎮 RANDOM ACC FREE FIRE
</div>

<div
    id="packages"
    class="packages"
>
Đang tải...
</div>

</section>


<section
    id="accountSection"
    class="section hidden"
>

<div class="section-title">
👤 TÀI KHOẢN CỦA BẠN
</div>

<div class="user-panel">

<div>
Email:
<strong id="userEmail"></strong>
</div>

<br>

<div>
Số dư:
<strong
    id="userBalance"
>
0đ
</strong>
</div>

<br>

<button
    class="btn btn-red"
    onclick="openDeposit()"
>
Nạp tiền
</button>

<button
    class="btn"
    onclick="loadOrders()"
>
Lịch sử mua
</button>

<div id="orders"></div>

</div>

</section>

</main>


<!-- AUTH -->

<div
    id="authModal"
    class="overlay"
>

<div class="modal">

<button
    class="close"
    onclick="closeModal('authModal')"
>
×
</button>

<h2 id="authTitle">
Đăng nhập
</h2>

<input
    id="email"
    type="email"
    placeholder="Email"
/>

<input
    id="password"
    type="password"
    placeholder="Mật khẩu"
/>

<button
    class="modal-btn"
    onclick="authAction()"
>
<span id="authActionText">
Đăng nhập
</span>
</button>

<p
    style="text-align:center;margin-top:15px"
>

<button
    style="background:none;color:#ff3b30"
    onclick="toggleAuthMode()"
    id="toggleAuth"
>
Chưa có tài khoản? Đăng ký
</button>

</p>

<div
    id="authMessage"
    class="notice"
>
</div>

</div>

</div>


<!-- DEPOSIT -->

<div
    id="depositModal"
    class="overlay"
>

<div class="modal">

<button
    class="close"
    onclick="closeModal('depositModal')"
>
×
</button>

<h2>
💰 Nạp tiền
</h2>

<p>
Nhập số tiền muốn nạp.
</p>

<input
    id="depositAmount"
    type="number"
    min="10000"
    placeholder="Ví dụ: 100000"
/>

<button
    class="modal-btn"
    onclick="createDeposit()"
>
Tạo yêu cầu nạp
</button>

<div
    id="depositResult"
    class="notice"
>
</div>

</div>

</div>


<!-- BUY -->

<div
    id="buyModal"
    class="overlay"
>

<div class="modal">

<button
    class="close"
    onclick="closeModal('buyModal')"
>
×
</button>

<h2>
🎁 Xác nhận mua
</h2>

<div id="buyInfo"></div>

<button
    class="modal-btn"
    onclick="confirmBuy()"
>
MUA NGAY
</button>

<div
    id="buyResult"
    class="account-result hidden"
>
</div>

</div>

</div>


<script type="module">

/*
====================================================
 FIREBASE CLIENT
====================================================

Thay config bên dưới bằng Firebase Web App của mày.

Firebase Console
→ Project Settings
→ Your apps
→ Web App
*/

import {
    initializeApp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const firebaseConfig = {

    apiKey:
        "YOUR_API_KEY",

    authDomain:
        "YOUR_PROJECT.firebaseapp.com",

    projectId:
        "YOUR_PROJECT_ID",

    storageBucket:
        "YOUR_PROJECT.firebasestorage.app",

    messagingSenderId:
        "YOUR_SENDER_ID",

    appId:
        "YOUR_APP_ID"
};


const firebaseApp =
    initializeApp(firebaseConfig);

const auth =
    getAuth(firebaseApp);


let currentUser = null;

let registerMode = false;

let selectedPackage = null;


/*
====================================================
 API
====================================================
*/

async function api(
    url,
    options = {}
){

    const user =
        auth.currentUser;

    const token =
        user
            ? await user.getIdToken()
            : null;

    options.headers = {
        "Content-Type":
            "application/json",

        ...(options.headers || {}),

        ...(token
            ? {
                Authorization:
                    `Bearer ${token}`
            }
            : {})
    };

    const response =
        await fetch(
            url,
            options
        );

    return response.json();
}


/*
====================================================
 FORMAT TIỀN
====================================================
*/

function money(number){

    return Number(number || 0)
        .toLocaleString("vi-VN")
        + "đ";

}


/*
====================================================
 LOAD GÓI
====================================================
*/

async function loadPackages(){

    const data =
        await api(
            "/api/packages"
        );

    const box =
        document.getElementById(
            "packages"
        );

    if (!data.success){

        box.innerHTML =
            `<div class="empty">
                Không tải được kho.
            </div>`;

        return;
    }

    box.innerHTML = "";

    Object.entries(
        data.packages
    ).forEach(
        ([id, item]) => {

            box.innerHTML += `

            <div class="card">

                <div class="card-image">
                    FF
                </div>

                <div class="card-body">

                    <span class="badge">
                        RANDOM ACC
                    </span>

                    <h3>
                        ${item.name}
                    </h3>

                    <div class="price">
                        ${money(item.price)}
                    </div>

                    <div class="stock">
                        Còn ${item.stock} acc
                    </div>

                    <button
                        class="buy"
                        onclick='openBuy(
                            ${JSON.stringify(id)},
                            ${JSON.stringify(item.name)},
                            ${Number(item.price)}
                        )'
                    >
                        MUA NGAY
                    </button>

                </div>

            </div>

            `;

        }
    );

}


/*
====================================================
 AUTH UI
====================================================
*/

window.openAuth =
    function(){

        document
            .getElementById(
                "authModal"
            )
            .style.display =
            "flex";

    };


window.toggleAuthMode =
    function(){

        registerMode =
            !registerMode;

        document
            .getElementById(
                "authTitle"
            )
            .textContent =
            registerMode
                ? "Đăng ký"
                : "Đăng nhập";

        document
            .getElementById(
                "authActionText"
            )
            .textContent =
            registerMode
                ? "Đăng ký"
                : "Đăng nhập";

        document
            .getElementById(
                "toggleAuth"
            )
            .textContent =
            registerMode
                ? "Đã có tài khoản? Đăng nhập"
                : "Chưa có tài khoản? Đăng ký";

    };


window.authAction =
    async function(){

        const email =
            document
                .getElementById(
                    "email"
                )
                .value
                .trim();

        const password =
            document
                .getElementById(
                    "password"
                )
                .value;

        const message =
            document
                .getElementById(
                    "authMessage"
                );

        try{

            if(registerMode){

                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

                message.textContent =
                    "Đăng ký thành công.";

            }else{

                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

                closeModal(
                    "authModal"
                );

            }

        }catch(error){

            message.textContent =
                error.message;

        }

    };


window.logout =
    async function(){

        await signOut(auth);

    };


/*
====================================================
 AUTH STATE
====================================================
*/

onAuthStateChanged(
    auth,
    async user => {

        currentUser =
            user;

        const loginButton =
            document.getElementById(
                "loginButton"
            );

        const logoutButton =
            document.getElementById(
                "logoutButton"
            );

        const accountSection =
            document.getElementById(
                "accountSection"
            );

        if(user){

            loginButton.classList
                .add("hidden");

            logoutButton.classList
                .remove("hidden");

            accountSection.classList
                .remove("hidden");

            document
                .getElementById(
                    "userEmail"
                )
                .textContent =
                user.email;

            await loadMe();

        }else{

            loginButton.classList
                .remove("hidden");

            logoutButton.classList
                .add("hidden");

            accountSection.classList
                .add("hidden");

            document
                .getElementById(
                    "balance"
                )
                .textContent =
                "0đ";

        }

    }
);


/*
====================================================
 LOAD BALANCE
====================================================
*/

async function loadMe(){

    const data =
        await api(
            "/api/me"
        );

    if(!data.success)
        return;

    document
        .getElementById(
            "balance"
        )
        .textContent =
        money(data.balance);

    document
        .getElementById(
            "userBalance"
        )
        .textContent =
        money(data.balance);

}


/*
====================================================
 DEPOSIT
====================================================
*/

window.openDeposit =
    function(){

        if(!currentUser){

            openAuth();

            return;
        }

        document
            .getElementById(
                "depositModal"
            )
            .style.display =
            "flex";

    };


window.createDeposit =
    async function(){

        const amount =
            Number(
                document
                    .getElementById(
                        "depositAmount"
                    )
                    .value
            );

        const result =
            document
                .getElementById(
                    "depositResult"
                );

        if(amount < 10000){

            result.textContent =
                "Tối thiểu 10.000đ.";

            return;
        }

        const data =
            await api(
                "/api/deposit",
                {
                    method:"POST",

                    body:
                        JSON.stringify({
                            amount
                        })
                }
            );

        if(!data.success){

            result.textContent =
                data.message;

            return;
        }

        /*
        Ở đây sau này gắn QR ngân hàng
        của mày.

        Nội dung chuyển khoản:
        orderId

        Ví dụ:
        NAP123ABC
        */

        result.innerHTML = `

            <b>Đã tạo yêu cầu.</b><br><br>

            Mã nạp:
            <strong>
                ${data.orderId}
            </strong>

            <br><br>

            Số tiền:
            <strong>
                ${money(data.amount)}
            </strong>

            <br><br>

            Chuyển đúng số tiền và dùng
            đúng mã nạp ở nội dung chuyển khoản.
            <br><br>

            Sau khi admin xác nhận,
            tiền sẽ được cộng vào ví.

        `;

    };


/*
====================================================
 BUY
====================================================
*/

window.openBuy =
    function(
        packageId,
        name,
        price
    ){

        if(!currentUser){

            openAuth();

            return;
        }

        selectedPackage = {
            packageId,
            name,
            price
        };

        document
            .getElementById(
                "buyInfo"
            )
            .innerHTML = `

                <div class="notice">

                    Gói:
                    <strong>
                        ${name}
                    </strong>

                    <br><br>

                    Giá:
                    <strong>
                        ${money(price)}
                    </strong>

                    <br><br>

                    Tiền sẽ được trừ
                    trực tiếp từ số dư ví.

                </div>

            `;

        document
            .getElementById(
                "buyResult"
            )
            .classList
            .add("hidden");

        document
            .getElementById(
                "buyModal"
            )
            .style.display =
            "flex";

    };


window.confirmBuy =
    async function(){

        if(!selectedPackage)
            return;

        const result =
            document
                .getElementById(
                    "buyResult"
                );

        result.classList
            .remove("hidden");

        result.textContent =
            "Đang xử lý...";

        const data =
            await api(
                "/api/buy",
                {
                    method:"POST",

                    body:
                        JSON.stringify({
                            packageId:
                                selectedPackage
                                    .packageId
                        })
                }
            );

        if(!data.success){

            result.textContent =
                data.message;

            return;
        }

        result.innerHTML = `

            <strong>
                🎉 MUA THÀNH CÔNG
            </strong>

            <div class="account-row">

                Tài khoản:
                <strong>
                    ${escapeHtml(
                        data.account.username
                    )}
                </strong>

            </div>

            <div class="account-row">

                Mật khẩu:
                <strong>
                    ${escapeHtml(
                        data.account.password
                    )}
                </strong>

            </div>

            <div class="account-row">

                Mã đơn:
                ${data.orderId}

            </div>

        `;

        await loadMe();

        await loadPackages();

    };


/*
====================================================
 ORDERS
====================================================
*/

window.loadOrders =
    async function(){

        const box =
            document
                .getElementById(
                    "orders"
                );

        const data =
            await api(
                "/api/orders"
            );

        if(!data.success){

            box.innerHTML =
                `<div class="notice">
                    Không tải được lịch sử.
                </div>`;

            return;
        }

        if(!data.orders.length){

            box.innerHTML =
                `<div class="notice">
                    Chưa có đơn hàng.
                </div>`;

            return;
        }

        box.innerHTML =
            data.orders
                .map(order => `

                    <div class="order">

                        <strong>
                            ${order.packageName}
                        </strong>

                        <br>

                        Giá:
                        ${money(order.price)}

                        <br>

                        Mã đơn:
                        ${order.orderId}

                        <br>

                        Tài khoản:
                        ${escapeHtml(
                            order.account.username
                        )}

                        <br>

                        Mật khẩu:
                        ${escapeHtml(
                            order.account.password
                        )}

                    </div>

                `)
                .join("");

    };


/*
====================================================
 UTILITY
====================================================
*/

window.closeModal =
    function(id){

        document
            .getElementById(id)
            .style.display =
            "none";

    };


function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/*
====================================================
 START
====================================================
*/

loadPackages();

</script>

</body>

</html>
