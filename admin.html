<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Đơn Nạp</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; }
        h2 { text-align: center; color: #00ff88; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #1e1e1e; }
        th, td { border: 1px solid #333; padding: 12px; text-align: center; }
        th { background: #252525; color: #00ff88; }
        .status-pending { color: #ffcc00; font-weight: bold; }
        .status-approved { color: #00ff88; font-weight: bold; }
        .status-rejected { color: #ff4444; font-weight: bold; }
        button { padding: 6px 12px; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; margin: 2px; }
        .btn-approve { background: #00ff88; color: #000; }
        .btn-reject { background: #ff4444; color: #fff; }
    </style>
</head>
<body>

    <h2>DANH SÁCH ĐƠN NẠP TIỀN (REALTIME)</h2>

    <table>
        <thead>
            <tr>
                <th>Mã Đơn</th>
                <th>Tài Khoản</th>
                <th>Gói Nạp</th>
                <th>Số Tiền</th>
                <th>Nội Dung/Memo</th>
                <th>Thời Gian</th>
                <th>Trạng Thái</th>
                <th>Thao Tác</th>
            </tr>
        </thead>
        <tbody id="orderTableBody">
            <tr><td colspan="8">Đang tải dữ liệu...</td></tr>
        </tbody>
    </table>

    <script>
        // Cấu hình Firebase Realtime Database
        const firebaseConfig = {
            databaseURL: "https://shopacc-df4fa-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Lắng nghe dữ liệu realtime từ Firebase
        db.ref('orders').on('value', (snapshot) => {
            const tbody = document.getElementById('orderTableBody');
            tbody.innerHTML = '';

            const data = snapshot.val();
            if (!data) {
                tbody.innerHTML = '<tr><td colspan="8">Chưa có đơn nạp nào!</td></tr>';
                return;
            }

            // Duyệt từng đơn và hiển thị
            Object.keys(data).reverse().forEach(key => {
                const order = data[key];
                const tr = document.createElement('tr');
                
                let statusText = 'Chờ duyệt';
                let statusClass = 'status-pending';
                if (order.status === 'approved') {
                    statusText = 'Đã duyệt';
                    statusClass = 'status-approved';
                } else if (order.status === 'rejected') {
                    statusText = 'Đã hủy';
                    statusClass = 'status-rejected';
                }

                tr.innerHTML = `
                    <td>${order.id || key}</td>
                    <td>${order.user || 'Khách'}</td>
                    <td>${order.package || 'N/A'}</td>
                    <td>${Number(order.price || 0).toLocaleString('vi-VN')} đ</td>
                    <td>${order.uid || 'Không có'}</td>
                    <td>${order.time || ''}</td>
                    <td class="${statusClass}">${statusText}</td>
                    <td>
                        ${order.status === 'pending' ? `
                            <button class="btn-approve" onclick="updateStatus('${key}', 'approved')">Duyệt</button>
                            <button class="btn-reject" onclick="updateStatus('${key}', 'rejected')">Hủy</button>
                        ` : 'Đã xử lý'}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        });

        // Cập nhật trạng thái đơn
        function updateStatus(orderId, status) {
            db.ref('orders/' + orderId).update({ status: status })
            .then(() => alert('Cập nhật thành công!'))
            .catch(err => alert('Lỗi: ' + err.message));
        }
    </script>
</body>
</html>
