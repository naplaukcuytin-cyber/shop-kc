<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Đơn Nạp - Shop KC</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; }
        h2 { text-align: center; color: #00ff88; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #1e1e1e; }
        th, td { border: 1px solid #333; padding: 12px; text-align: center; }
        th { background: #252525; color: #00ff88; }
        .status-pending { color: #ffcc00; font-weight: bold; }
        .status-approved { color: #00ff88; font-weight: bold; }
        .status-rejected { color: #ff4444; font-weight: bold; }
        button { padding: 6px 12px; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; margin: 2px; }
        .btn-approve { background: #00ff88; color: #000; }
        .btn-reject { background: #ff4444; color: #fff; }
    </style>
</head>
<body>
    <h2>DANH SÁCH ĐƠN NẠP TIỀN (REALTIME)</h2>
    <table>
        <thead>
            <tr>
                <th>Mã Đơn</th><th>Tài Khoản</th><th>Gói Nạp</th><th>Số Tiền</th>
                <th>Nội Dung/Memo</th><th>Thời Gian</th><th>Trạng Thái</th><th>Thao Tác</th>
            </tr>
        </thead>
        <tbody id="orderTableBody">
            <tr><td colspan="8">Đang tải dữ liệu...</td></tr>
        </tbody>
    </table>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCt2ExrDINqixjs3bfEewOviB4ICTfrSEs",
            authDomain: "shop-kc.firebaseapp.com",
            projectId: "shop-kc",
            storageBucket: "shop-kc.firebasestorage.app",
            messagingSenderId: "1073242689799",
            appId: "1:1073242689799:web:41d0dc7795eb74a93df5a2",
            measurementId: "G-Q9VN7NZHR0",
            databaseURL: "https://shop-kc-default-rtdb.firebaseio.com"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('orders').on('value', (snapshot) => {
            const tbody = document.getElementById('orderTableBody');
            tbody.innerHTML = '';

            const data = snapshot.val();
            if (!data) {
                tbody.innerHTML = '<tr><td colspan="8">Chưa có đơn nạp nào!</td></tr>';
                return;
            }

            Object.keys(data).reverse().forEach(key => {
                const order = data[key];
                const tr = document.createElement('tr');

                let statusText = 'Chờ duyệt';
                let statusClass = 'status-pending';

                if (order.status === 'approved') {
                    statusText = 'Đã duyệt';
                    statusClass = 'status-approved';
                } else if (order.status === 'rejected') {
                    statusText = 'Đã hủy';
                    statusClass = 'status-rejected';
                }

                tr.innerHTML = `
                    <td>${order.id || key}</td>
                    <td>${order.user || 'Khách'}</td>
                    <td>${order.package || 'N/A'}</td>
                    <td>${Number(order.price || 0).toLocaleString('vi-VN')} đ</td>
                    <td>${order.uid || 'Không có'}</td>
                    <td>${order.time || ''}</td>
                    <td class="${statusClass}">${statusText}</td>
                    <td>
                        ${order.status === 'pending' ? `
                            <button class="btn-approve" onclick="updateStatus('${key}', 'approved')">Duyệt</button>
                            <button class="btn-reject" onclick="updateStatus('${key}', 'rejected')">Hủy</button>
                        ` : 'Đã xử lý'}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }, (error) => {
            console.error(error);
            document.getElementById('orderTableBody').innerHTML =
                '<tr><td colspan="8">Không đọc được Firebase: ' +
                String(error.message || error) + '</td></tr>';
        });

        function updateStatus(orderId, status) {
            const orderRef = db.ref('orders/' + orderId);

            orderRef.once('value').then(snapshot => {
                const order = snapshot.val();

                if (!order) {
                    throw new Error('Không tìm thấy đơn nạp.');
                }

                // Hủy đơn: chỉ đổi trạng thái, không cộng tiền.
                if (status === 'rejected') {
                    return orderRef.update({
                        status: 'rejected',
                        updatedAt: firebase.database.ServerValue.TIMESTAMP
                    });
                }

                // Đã duyệt rồi thì tuyệt đối không cộng lần 2.
                if (order.status === 'approved') {
                    throw new Error('Đơn này đã được duyệt trước đó.');
                }

                const user = String(order.user || '').trim();
                const amount = Number(order.price || 0);

                if (!user) throw new Error('Đơn không có tài khoản khách.');
                if (!Number.isFinite(amount) || amount <= 0) {
                    throw new Error('Số tiền trong đơn không hợp lệ.');
                }

                // QUAN TRỌNG:
                // Phải dùng đúng key mà trang khách dùng để đọc số dư.
                // Nếu trang khách của mày đang đọc balances/<username>,
                // dòng này sẽ cộng tiền đúng vào tài khoản đó.
                const balanceRef = db.ref('balances/' + encodeURIComponent(user));

                return balanceRef.transaction(currentBalance => {
                    return (Number(currentBalance) || 0) + amount;
                }).then(result => {
                    if (!result.committed) {
                        throw new Error('Firebase không commit được số dư.');
                    }

                    return orderRef.update({
                        status: 'approved',
                        approvedAt: firebase.database.ServerValue.TIMESTAMP,
                        approvedAmount: amount
                    });
                });
            }).then(() => {
                alert(
                    status === 'approved'
                        ? 'Đã duyệt đơn và cộng ' +
                          Number(arguments[0] ? 0 : 0) +
                          'đ vào tài khoản khách!'
                        : 'Đã hủy đơn!'
                );
            }).catch(err => {
                console.error('Lỗi updateStatus:', err);
                alert('Lỗi: ' + (err.message || err));
            });
        }
    </script>
</body>
</html>
