<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Tự Động 24/7</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            padding: 15px;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
        }
        header h1 { color: #38bdf8; font-size: 22px; margin-bottom: 5px; }
        header p { color: #94a3b8; font-size: 13px; }
        
        .grid-products {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
        }
        .product-card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .product-price {
            color: #4ade80;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 12px;
        }
        .buy-btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .buy-btn:hover { background-color: #0ea5e9; }
    </style>
</head>
<body>

    <header>
        <h1>⚡ SIÊU THỊ SỐ TỰ ĐỘNG</h1>
        <p>Thanh toán tự động - Nhận hàng tức thì 24/7</p>
    </header>

    <div class="grid-products">
        <!-- Sản phẩm 1 -->
        <div class="product-card">
            <div>
                <div class="product-title">Tài khoản Netflix Premium (1 Tháng)</div>
                <div class="product-price">50.000 đ</div>
            </div>
            <button class="buy-btn" onclick="muaHang('Netflix Premium', 50000)">Mua Ngay</button>
        </div>

        <!-- Sản phẩm 2 -->
        <div class="product-card">
            <div>
                <div class="product-title">Key Bản Quyền Tool Auto (1 Năm)</div>
                <div class="product-price">120.000 đ</div>
            </div>
            <button class="buy-btn" onclick="muaHang('Key Tool Auto', 120000)">Mua Ngay</button>
        </div>

        <!-- Sản phẩm 3 -->
        <div class="product-card">
            <div>
                <div class="product-title">Gói 1000 Follow TikTok Uy Tín</div>
                <div class="product-price">80.000 đ</div>
            </div>
            <button class="buy-btn" onclick="muaHang('1000 Follow TikTok', 80000)">Mua Ngay</button>
        </div>
    </div>

    <script>
        function muaHang(tenSP, gia) {
            let xacNhan = confirm("Bạn có muốn mua: " + tenSP + " với giá " + gia.toLocaleString() + "đ không?");
            if (xacNhan) {
                alert("Hệ thống đang tạo mã QR thanh toán VietQR cho sản phẩm: " + tenSP + ".\n(Sau khi chuyển khoản, web sẽ tự động nhả tài khoản/key cho bạn!)");
            }
        }
    </script>

</body>
</html>
